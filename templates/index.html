<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Calculator</title>
  <style>
    body { font-family: Consolas, "Courier New", monospace; background: #f2f4f7; display: flex; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; width: 100%; max-width: 380px; padding: 24px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    h1 { text-align: center; font-size: 20px; border-top: 2px dashed #999; border-bottom: 2px dashed #999; padding: 10px 0; margin: 0 0 20px; }
    label { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    input { width: 180px; padding: 6px 8px; font: inherit; border: 1px solid #aaa; border-radius: 4px; }
    button { display: block; margin: 20px auto 0; padding: 10px 28px; font: inherit; font-weight: bold; background: #1f4e79; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .result { margin-top: 20px; border-top: 2px dashed #999; border-bottom: 2px dashed #999; padding: 10px 0; }
    .pass { color: #0a7a2f; font-weight: bold; } .fail { color: #b3001b; font-weight: bold; }
    .error { color: #b3001b; margin-top: 16px; text-align: center; }
    small { display: block; text-align: center; color: #777; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>STUDENT CALCULATOR</h1>
    <form method="post">
      <label>Name: <input name="name" value="{{ form.get('name', '') }}" required></label>
      <label>Test 1: <input name="test1" type="number" min="0" max="100" step="any" value="{{ form.get('test1', '') }}" required></label>
      <label>Test 2: <input name="test2" type="number" min="0" max="100" step="any" value="{{ form.get('test2', '') }}" required></label>
      <label>Exam: <input name="exam" type="number" min="0" max="100" step="any" value="{{ form.get('exam', '') }}" required></label>
      <button type="submit">CALCULATE</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if result %}
    <div class="result">
      Student: {{ result.name }}<br>
      Average: {{ result.average }}<br>
      Result:&nbsp; <span class="{{ 'pass' if result.status == 'PASS' else 'fail' }}">{{ result.status }}</span>
      ({{ 'ЗАЧЁТ' if result.status == 'PASS' else 'НЕЗАЧЁТ' }})
    </div>
    {% endif %}
    <small>Зачёт при среднем балле ≥ {{ pass_score }}</small>
  </div>
</body>
</html>
